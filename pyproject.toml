[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pruefstand"
version = "0.1.0"
description = "A reproducible crash-test lab for AI agents: record, replay, inject faults, and measure reliability."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Soham Shinde"}]
keywords = ["agents", "evaluation", "chaos-engineering", "reliability", "llm"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
analytics = ["duckdb>=1.2,<3"]
otel = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]
frameworks = ["langgraph>=1,<2", "openai-agents>=0.6,<1", "mcp>=1,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2", "httpx>=0.27,<1", "duckdb>=1.2,<3", "opentelemetry-sdk>=1.30,<2"]

[project.scripts]
pruefstand = "pruefstand.cli:main"

[project.urls]
Repository = "https://github.com/sohamshindework/pruefstand"
Documentation = "https://github.com/sohamshindework/pruefstand/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pruefstand = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

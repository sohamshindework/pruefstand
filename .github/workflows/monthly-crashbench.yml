name: Monthly CrashBench fixtures

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: pruefstand run --repeats 5 --seed 42 --out artifacts/monthly
      - run: pruefstand gate --baseline benchmarks/baseline.json --candidate artifacts/monthly/profiles/idempotent-agent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-crashbench-evidence
          path: artifacts/monthly/
          retention-days: 30

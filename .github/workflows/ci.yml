name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=pruefstand --cov-report=xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: python-distributions
          path: dist/*

  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,frameworks]'
      - run: python -m pytest tests/test_frameworks.py -q
      - run: python examples/langgraph_refund.py

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test sdk/typescript/test/*.test.ts
      - run: node --check ratings/dist/app.js

  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: pruefstand run --repeats 5 --seed 42 --out artifacts/ci
      - uses: ./.github/actions/reliability-gate
        with:
          baseline: benchmarks/baseline.json
          candidate: artifacts/ci/profiles/idempotent-agent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: artifacts/ci/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pruefstand:test .
      - name: Run isolated fixture experiment
        run: |
          mkdir -p artifacts/container
          sudo chown 10001:10001 artifacts/container
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=bind,src="$PWD/artifacts/container",dst=/output \
            pruefstand:test demo --out /output --repeats 2 --bootstrap 100
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-demo
          path: artifacts/container/

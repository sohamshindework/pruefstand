name: Prüfstand reliability gate
description: Compare compatible reliability profiles and fail on regression
inputs:
  baseline:
    description: Baseline profile JSON path
    required: true
  candidate:
    description: Candidate profile JSON path
    required: true
  max-drop:
    description: Maximum allowed absolute score decrease
    default: '0.05'
  min-runs:
    description: Minimum labelled runs per profile
    default: '20'
  min-tasks:
    description: Minimum independent tasks per profile
    default: '3'
  comment:
    description: Post/update a PR comment (requires pull-requests write; disabled for fork PRs)
    default: 'false'
  github-token:
    description: Optional token for PR comments
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Install Prüfstand from the action revision
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH/../../.."
    - name: Compare reliability profiles
      id: gate
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        MAX_DROP: ${{ inputs.max-drop }}
        MIN_RUNS: ${{ inputs.min-runs }}
        MIN_TASKS: ${{ inputs.min-tasks }}
      run: |
        python -m pruefstand gate --baseline "$BASELINE" --candidate "$CANDIDATE" \
          --max-drop "$MAX_DROP" --min-runs "$MIN_RUNS" --min-tasks "$MIN_TASKS" \
          --out "$RUNNER_TEMP/pruefstand-gate.json" --markdown "$RUNNER_TEMP/pruefstand-gate.md"
    - name: Publish step summary
      if: always()
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/pruefstand-gate.md" ]; then
          cat "$RUNNER_TEMP/pruefstand-gate.md" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Update PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path').join(process.env.RUNNER_TEMP, 'pruefstand-gate.md');
          if (!fs.existsSync(path)) return;
          const marker = '<!-- pruefstand-reliability-gate -->';
          const body = marker + '\n' + fs.readFileSync(path, 'utf8');
          const params = {...context.repo, issue_number: context.issue.number};
          const comments = await github.paginate(github.rest.issues.listComments, params);
          const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
          else await github.rest.issues.createComment({...params, body});
